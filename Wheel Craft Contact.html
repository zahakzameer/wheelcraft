<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact — Wheel Craft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Get in touch with Wheel Craft — alloy wheel repair and remanufacturing in Highton, Geelong VIC.">
<link rel="stylesheet" href="theme.css">
<style>
  @media (max-width:860px){ [data-grid-2]{grid-template-columns:1fr !important;} }
</style>
</head>
<body>

<div style="background:var(--ink-950);color:var(--fg-primary-dark);min-height:100vh;">
  <nav style="background:var(--ink-950);border-bottom:1px solid var(--border-subtle-dark);">
    <div style="max-width:1320px;margin:0 auto;padding:0 32px;height:78px;display:flex;align-items:center;justify-content:space-between;">
      <a href="index.html#home" style="display:flex;align-items:center;">
        <img src="assets/wheelcraft-logo.png" alt="Wheel Craft" style="height:46px;width:auto;object-fit:contain;"/>
      </a>
      <a href="index.html#home" style="color:var(--fg-secondary-dark);font-size:14px;font-weight:600;">← Back to home</a>
    </div>
  </nav>

  <section style="padding:80px 32px 120px;max-width:1320px;margin:0 auto;">
    <div style="display:grid;grid-template-columns:0.9fr 1.1fr;gap:60px;align-items:center;" data-grid-2>
      <div>
        <div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;">Contact</div>
        <h1 style="font-family:var(--font-display);font-weight:var(--fw-bold);font-size:38px;margin:0 0 30px;color:var(--fg-primary-dark);">Talk to the workshop</h1>
        <div style="display:flex;flex-direction:column;gap:20px;margin-bottom:34px;">
          <div style="display:flex;gap:14px;align-items:flex-start;">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-top:2px;flex-shrink:0;"><path d="M3 4h4l2 5-2.5 1.5a11 11 0 005 5L13 13l5 2v4a2 2 0 01-2 2C8 21 1 14 1 6a2 2 0 012-2z" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>
            <a href="tel:+61433726921" style="color:var(--fg-primary-dark);font-size:15.5px;font-weight:600;">+61 433 726 921</a>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-top:2px;flex-shrink:0;"><path d="M2 5h16v10H2z" fill="none" stroke="var(--accent)" stroke-width="1.5"/><path d="M2 5l8 6 8-6" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>
            <a href="mailto:wheelcraft.au@gmail.com" style="color:var(--fg-primary-dark);font-size:15.5px;font-weight:600;">wheelcraft.au@gmail.com</a>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-top:2px;flex-shrink:0;"><path d="M10 19s6-6.2 6-11a6 6 0 10-12 0c0 4.8 6 11 6 11z" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="10" cy="8" r="2.2" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>
            <span style="color:var(--fg-primary-dark);font-size:15.5px;font-weight:600;">7 Narrawong Avenue, Highton, Geelong VIC</span>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;">
            <svg width="20" height="20" viewBox="0 0 20 20" style="margin-top:2px;flex-shrink:0;"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--accent)" stroke-width="1.5"/><path d="M10 5v5l3.5 2" stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
            <span style="color:var(--fg-primary-dark);font-size:15.5px;font-weight:600;">Mon–Fri 8am–5:30pm · Sat 9am–1pm</span>
          </div>
        </div>
        <a href="Wheel Craft Quote.html" style="background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;padding:15px 28px;border-radius:10px;display:inline-block;">Get a Free Quote</a>
      </div>
      <img src="assets/generated/contact-map.jpg" alt="Wheel Craft location — 7 Narrawong Ave, Highton, Geelong VIC" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;"/>
    </div>
  </section>
</div>

<script src="site.js"></script>
</body>
</html>
